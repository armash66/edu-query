<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduQuery is a privacy-first academic marksheet analysis, deterministic data quality verification, and faculty analytics engine." />
    
    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EduQuery — Academic Marksheet Analysis Engine" />
    <meta property="og:description" content="Privacy-first academic marksheet analysis, deterministic data quality verification, and faculty analytics." />
    <meta property="og:url" content="https://edu-query-hazel.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EduQuery — Academic Marksheet Analysis Engine" />
    <meta name="twitter:description" content="Privacy-first academic marksheet analysis, deterministic data quality verification, and faculty analytics." />

    <!-- Theme Color Specifications -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>EduQuery — Academic Marksheet Analysis Engine</title>

    <!-- Pre-paint Theme Resolution Script (Flash Prevention) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eduquery_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || saved === 'light') ? saved : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
